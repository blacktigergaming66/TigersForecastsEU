<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TECOF - Tiger's European Convective Outlook Forecast</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="https://unpkg.com/leaflet-editable@1.2.0/src/Leaflet.Editable.js"></script>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0d1117;
    color:white;
}

header{
    background:#161b22;
    padding:18px;
    text-align:center;
    font-size:28px;
    font-weight:bold;
    border-bottom:2px solid #30363d;
}

nav{
    display:flex;
    justify-content:center;
    gap:10px;
    padding:15px;
    background:#111827;
}

nav button{
    background:#2563eb;
    border:none;
    padding:12px 20px;
    color:white;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

nav button:hover{
    background:#1d4ed8;
}

.page{
    display:none;
    padding:20px;
}

.active{
    display:block;
}

.map{
    width:100%;
    height:650px;
    border-radius:12px;
    margin-top:20px;
    border:2px solid #30363d;
}

.save-btn{
    background:#16a34a;
    border:none;
    padding:10px 15px;
    border-radius:8px;
    color:white;
    margin:5px;
    cursor:pointer;
    font-weight:bold;
}

.save-btn:hover{
    background:#15803d;
}

.model-links{
    margin-top:20px;
    background:#161b22;
    padding:15px;
    border-radius:12px;
}

.model-links a{
    display:inline-block;
    margin:5px;
    padding:10px 14px;
    background:#2563eb;
    color:white;
    text-decoration:none;
    border-radius:8px;
    font-weight:bold;
}

.model-links a:hover{
    background:#1d4ed8;
}

.sig-box{
    margin-top:20px;
    background:#161b22;
    border:2px solid #30363d;
    border-radius:12px;
    padding:15px;
}

.sig-entry{
    margin-top:15px;
}

.sig-entry textarea{
    width:100%;
    height:100px;
    background:#0d1117;
    border:1px solid #30363d;
    color:white;
    padding:10px;
    border-radius:8px;
    resize:vertical;
    margin-top:8px;
}

</style>
</head>

<body>

<header>TECOF - European Convective Outlook Forecast</header>

<nav>

    <button onclick="showPage('dynamicPage')">
        Dynamic Map
    </button>

    <button onclick="openCustomize()">
        Customize
    </button>

</nav>

<!-- =========================
DYNAMIC MAP
========================= -->

<div class="page active" id="dynamicPage">

<h2>Dynamic Forecast Map</h2>

<input type="date" id="loadDate">

<button class="save-btn"
onclick="loadForecast()">
Load Forecast
</button>

<div id="dynamicMap" class="map"></div>

</div>

<!-- =========================
CUSTOM PAGE
========================= -->

<div class="page" id="customPage">

<h2>Customize Forecast</h2>

<input type="password"
id="pass"
placeholder="Password">

<button class="save-btn"
onclick="unlock()">
Unlock
</button>

<div id="customizationPanel"
style="display:none;">

<br><br>

<input type="date" id="saveDate">

<select id="risk">

<option>MRGL</option>
<option>LOW</option>
<option>SLGT</option>
<option>ENH</option>
<option>MDT</option>
<option>HIGH</option>
<option>SIG</option>

</select>

<br><br>

<button class="save-btn"
onclick="endPoly()">
END POLYGON
</button>

<button class="save-btn"
onclick="editModeOn()">
EDIT
</button>

<button class="save-btn"
onclick="clearDraft()">
CLEAR
</button>

<button class="save-btn"
onclick="save()">
SAVE
</button>

<button class="save-btn"
onclick="exportGeo()">
EXPORT GEOJSON
</button>

<button class="save-btn"
onclick="downloadEuropePNG()">
DOWNLOAD EUROPE PNG
</button>

<button class="save-btn"
onclick="downloadTransparentPNG()">
DOWNLOAD RISKS ONLY
</button>

<input type="file"
onchange="importGeo(event)">

<div class="model-links">

<h3>Forecast Model Links</h3>

<a href="https://meteologix.com/pl/model-charts/deu-hd/europe/deep-layer-shear.html"
target="_blank">
SHEAR
</a>

<a href="https://meteologix.com/pl/model-charts/euro/europe/mu-cape/20260515-1400z.html"
target="_blank">
CAPE
</a>

<a href="https://meteologix.com/pl/model-charts/swisshd-eu/europe/storm-relative-helicity/20260515-1400z.html"
target="_blank">
SRH
</a>

<a href="https://meteologix.com/pl/model-charts/swisshd-eu/europe/supercell-composite/20260515-1400z.html"
target="_blank">
SCC
</a>

</div>

<div id="customMap" class="map"></div>

<!-- =========================
SIG DESCRIPTIONS
========================= -->

<div class="sig-box">

<h3>SIG Zone Descriptions</h3>

<div id="sigDescriptions"></div>

</div>

</div>

</div>

<script>

/* =========================
MAPS
========================= */

const dynamicMap = L.map("dynamicMap")
.setView([54,15],4);

L.tileLayer(
'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
).addTo(dynamicMap);

const customMap = L.map("customMap")
.setView([54,15],4);

L.tileLayer(
'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
).addTo(customMap);

/* ENABLE EDITING */

customMap.editTools =
new L.Editable(customMap);

/* =========================
PASSWORD SYSTEM
========================= */

const PASSWORD = "TECOFTIGER";

let unlocked = false;
let editMode = false;

function unlock(){

    const input =
    document.getElementById("pass").value;

    if(input === PASSWORD){

        unlocked = true;

        document.getElementById(
            "customizationPanel"
        ).style.display = "block";

        setTimeout(() => {
            customMap.invalidateSize();
        }, 200);

        alert("Customization unlocked");

    } else {

        alert("Wrong password");
    }
}

function openCustomize(){

    showPage("customPage");

    if(!unlocked){

        document.getElementById(
            "customizationPanel"
        ).style.display = "none";
    }
}

/* =========================
STATE
========================= */

let points = [];
let markers = [];
let draft = null;

let polygons = [];
let dynamicLayers = [];

/* =========================
COLORS
========================= */

function color(r){

    return {

        MRGL:"#14532d",
        LOW:"#22c55e",
        SLGT:"#eab308",
        ENH:"#f97316",
        MDT:"#dc2626",
        HIGH:"#ec4899",
        SIG:"#000000"

    }[r];
}

/* =========================
DRAW
========================= */

customMap.on("click",e=>{

    if(!unlocked) return;

    let p=[e.latlng.lat,e.latlng.lng];

    points.push(p);

    let m=L.marker(p,{
        draggable:true
    }).addTo(customMap);

    markers.push(m);

    m.on("drag",ev=>{

        let i=markers.indexOf(m);

        let ll=ev.target.getLatLng();

        points[i]=[ll.lat,ll.lng];

        draw();
    });

    draw();
});

function draw(){

    if(draft)
    customMap.removeLayer(draft);

    if(points.length<2) return;

    let risk =
    document.getElementById("risk").value;

    draft=L.polygon(points,{

        color:color(risk),

        fillColor:color(risk),

        fillOpacity:0.35,

        weight:risk === "SIG" ? 4 : 2,

        dashArray:risk === "SIG"
        ? "12 8"
        : null

    }).addTo(customMap);
}

/* =========================
END POLYGON
========================= */

function endPoly(){

    if(!unlocked) return;

    if(points.length<3){

        alert("Need 3 points");
        return;
    }

    let risk =
    document.getElementById("risk").value;

    let poly = L.polygon(points,{

        color:color(risk),

        fillColor:color(risk),

        fillOpacity:0.35,

        weight:risk === "SIG" ? 4 : 2,

        dashArray:risk === "SIG"
        ? "12 8"
        : null

    }).addTo(customMap);

    const obj = {

        layer:poly,
        risk:risk,
        sigDescription:""

    };

    polygons.push(obj);

    poly.on("click",()=>select(poly));

    poly.on("contextmenu",()=>{

        if(obj.risk !== "SIG") return;

        alert(
            obj.sigDescription ||
            "No SIG description."
        );
    });

    /* CREATE SIG TEXT BOX */

    if(risk === "SIG"){

        const sigCount =
        polygons.filter(
            p=>p.risk==="SIG"
        ).length;

        const wrap =
        document.createElement("div");

        wrap.className = "sig-entry";

        wrap.innerHTML = `
            <label>
                <b>SIG ${sigCount}</b>
            </label>

            <textarea
            placeholder="Write SIG reasoning here...">
            </textarea>
        `;

        const textarea =
        wrap.querySelector("textarea");

        textarea.addEventListener(
            "input",
            ()=>{
                obj.sigDescription =
                textarea.value;
            }
        );

        document.getElementById(
            "sigDescriptions"
        ).appendChild(wrap);
    }

    clearDraft();
}

/* =========================
CLEAR
========================= */

function clearDraft(){

    markers.forEach(m=>
        customMap.removeLayer(m)
    );

    markers=[];

    points=[];

    if(draft)
    customMap.removeLayer(draft);

    draft=null;
}

/* =========================
EDIT
========================= */

function editModeOn(){

    if(!unlocked){

        alert("Unlock first");
        return;
    }

    editMode=true;

    alert("Click polygon to edit");
}

function select(poly){

    if(!editMode) return;

    poly.enableEdit();

    alert("Editing enabled");

    editMode=false;
}

/* =========================
SAVE
========================= */

function save(){

    if(!unlocked) return;

    let date=
    document.getElementById("saveDate").value;

    if(!date){

        alert("Pick date");
        return;
    }

    localStorage.setItem(

        "f_"+date,

        JSON.stringify(

            polygons.map(p=>({

                risk:p.risk,

                sigDescription:
                p.sigDescription || "",

                points:
                p.layer.getLatLngs()[0]

            }))
        )
    );

    alert("Saved");
}

/* =========================
LOAD FORECAST
========================= */

function loadForecast(){

    let d=
    document.getElementById("loadDate").value;

    let data=
    localStorage.getItem("f_"+d);

    dynamicLayers.forEach(l=>
        dynamicMap.removeLayer(l)
    );

    dynamicLayers=[];

    if(!data){

        alert("No data");
        return;
    }

    JSON.parse(data).forEach(f=>{

        let layer=L.polygon(f.points,{

            color:color(f.risk),

            fillColor:color(f.risk),

            fillOpacity:0.35,

            weight:f.risk === "SIG"
            ? 4
            : 2,

            dashArray:f.risk === "SIG"
            ? "12 8"
            : null

        }).addTo(dynamicMap);

        if(f.risk === "SIG"){

            layer.on("contextmenu",()=>{

                alert(
                    f.sigDescription ||
                    "No SIG description."
                );
            });
        }

        dynamicLayers.push(layer);
    });
}

/* =========================
EXPORT GEOJSON
========================= */

function exportGeo(){

    if(!unlocked) return;

    let geo={

        type:"FeatureCollection",

        features:polygons.map(p=>({

            type:"Feature",

            properties:{
                risk:p.risk,
                sigDescription:
                p.sigDescription || ""
            },

            geometry:{
                type:"Polygon",

                coordinates:[

                    p.layer.getLatLngs()[0]
                    .map(x=>[x.lng,x.lat])

                ]
            }
        }))
    };

    let blob=new Blob(
        [JSON.stringify(geo)],
        {type:"application/json"}
    );

    let a=document.createElement("a");

    a.href=URL.createObjectURL(blob);

    a.download="forecast.geojson";

    a.click();
}

/* =========================
IMPORT GEOJSON
========================= */

function importGeo(e){

    if(!unlocked) return;

    let r=new FileReader();

    r.onload=ev=>{

        let data=
        JSON.parse(ev.target.result);

        data.features.forEach(f=>{

            let pts=
            f.geometry.coordinates[0]
            .map(x=>[x[1],x[0]]);

            let risk =
            f.properties.risk;

            let poly=L.polygon(pts,{

                color:color(risk),

                fillColor:color(risk),

                fillOpacity:0.35,

                weight:risk === "SIG"
                ? 4
                : 2,

                dashArray:risk === "SIG"
                ? "12 8"
                : null

            }).addTo(customMap);

            const obj = {

                layer:poly,
                risk:risk,

                sigDescription:
                f.properties.sigDescription || ""

            };

            polygons.push(obj);

            poly.on("click",()=>select(poly));

            poly.on("contextmenu",()=>{

                if(obj.risk !== "SIG") return;

                alert(
                    obj.sigDescription ||
                    "No SIG description."
                );
            });

            if(risk === "SIG"){

                const sigCount =
                polygons.filter(
                    p=>p.risk==="SIG"
                ).length;

                const wrap =
                document.createElement("div");

                wrap.className =
                "sig-entry";

                wrap.innerHTML = `
                    <label>
                        <b>SIG ${sigCount}</b>
                    </label>

                    <textarea>
${obj.sigDescription}
</textarea>
                `;

                const textarea =
                wrap.querySelector("textarea");

                textarea.addEventListener(
                    "input",
                    ()=>{
                        obj.sigDescription =
                        textarea.value;
                    }
                );

                document.getElementById(
                    "sigDescriptions"
                ).appendChild(wrap);
            }
        });

        alert("Imported");
    };

    r.readAsText(e.target.files[0]);
}

/* =========================
DOWNLOAD MAP PNG
========================= */

function downloadEuropePNG(){

    html2canvas(
        document.getElementById("customMap")
    ).then(canvas=>{

        let a=document.createElement("a");

        a.download="forecast-map.png";

        a.href=canvas.toDataURL();

        a.click();
    });
}

/* =========================
DOWNLOAD RISKS ONLY
========================= */

function downloadTransparentPNG(){

    const pane=document.querySelector(
        ".leaflet-tile-pane"
    );

    pane.style.display="none";

    html2canvas(
        document.getElementById("customMap"),
        {backgroundColor:null}
    ).then(canvas=>{

        let a=document.createElement("a");

        a.download="risks-only.png";

        a.href=canvas.toDataURL();

        a.click();

        pane.style.display="block";
    });
}

/* =========================
PAGE SWITCH
========================= */

function showPage(id){

    document.querySelectorAll(".page")
    .forEach(p=>
        p.classList.remove("active")
    );

    document.getElementById(id)
    .classList.add("active");

    setTimeout(()=>{

        dynamicMap.invalidateSize();

        customMap.invalidateSize();

    },200);
}

</script>

</body>
</html>
