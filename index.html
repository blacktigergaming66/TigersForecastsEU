<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TECOF - Tiger's European Convective Outlook Forecast</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-editable@1.2.0/src/Leaflet.Editable.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0d1117;
    color:white;
}

header{
    background:#161b22;
    padding:18px;
    text-align:center;
    font-size:28px;
    font-weight:bold;
    border-bottom:2px solid #30363d;
}

nav{
    display:flex;
    justify-content:center;
    gap:10px;
    padding:15px;
    background:#111827;
}

nav button{
    background:#2563eb;
    border:none;
    padding:12px 20px;
    color:white;
    border-radius:10px;
    cursor:pointer;
}

.page{
    display:none;
    padding:20px;
}

.active{
    display:block;
}

.map{
    width:100%;
    height:650px;
    border-radius:12px;
    margin-top:20px;
    border:2px solid #30363d;
}

.save-btn{
    background:#16a34a;
    border:none;
    padding:10px 15px;
    border-radius:8px;
    color:white;
    margin:5px;
    cursor:pointer;
}

</style>
</head>

<body>

<header>TECOF - Tiger's European Convective Outlook Forecast</header>

<nav>
    <button onclick="showPage('dynamicPage')">Dynamic Map</button>
    <button onclick="showPage('customPage')">Customize</button>
</nav>

<!-- DYNAMIC MAP -->
<div class="page active" id="dynamicPage">

<h2>Dynamic Map</h2>

<input type="date" id="loadDate">
<button class="save-btn" onclick="loadForecast()">Load Forecast</button>

<div id="dynamicMap" class="map"></div>
</div>

<!-- CUSTOM -->
<div class="page" id="customPage">

<h2>Customize Forecast</h2>

<input type="password" id="pass" placeholder="Password">
<button class="save-btn" onclick="unlock()">Unlock</button>

<br><br>

<input type="date" id="saveDate">

<select id="risk">
<option>MRGL</option>
<option>LOW</option>
<option>SLGT</option>
<option>ENH</option>
<option>MDT</option>
<option>HIGH</option>
<option>SIG</option>
</select>

<br>

<button class="save-btn" onclick="endPoly()">END POLYGON</button>
<button class="save-btn" onclick="editModeOn()">EDIT</button>
<button class="save-btn" onclick="clearDraft()">CLEAR</button>
<button class="save-btn" onclick="save()">SAVE</button>
<button class="save-btn" onclick="exportGeo()">EXPORT GEOJSON</button>

<input type="file" onchange="importGeo(event)">

<div id="customMap" class="map"></div>
</div>

<script>

/* =========================
MAPS
========================= */

const dynamicMap = L.map("dynamicMap").setView([54,15],4);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(dynamicMap);

const customMap = L.map("customMap").setView([54,15],4);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(customMap);

/* Editable support */
customMap.editTools = new L.Editable(customMap);

/* =========================
AUTH SYSTEM
========================= */

const PASSWORD = "TECOFTIGER";
let unlocked = false;
let editMode = false;

/* =========================
STATE
========================= */

let points = [];
let markers = [];
let draft = null;

let polygons = [];
let dynamicLayers = [];

/* =========================
COLOR SYSTEM
========================= */

function color(r){
    return {
        MRGL:"#14532d",
        LOW:"#22c55e",
        SLGT:"#eab308",
        ENH:"#f97316",
        MDT:"#dc2626",
        HIGH:"#ec4899",
        SIG:"#000000"
    }[r] || "#22c55e";
}

/* =========================
UNLOCK SYSTEM
========================= */

function unlock(){
    const input = document.getElementById("pass").value;

    if(input === PASSWORD){
        unlocked = true;
        alert("Unlocked TECOF system");
    } else {
        unlocked = false;
        alert("Wrong password");
    }
}

/* =========================
DRAWING (LOCKED)
========================= */

customMap.on("click", e => {

    if(!unlocked) return;

    let p = [e.latlng.lat, e.latlng.lng];
    points.push(p);

    let m = L.marker(p,{draggable:true}).addTo(customMap);
    markers.push(m);

    m.on("drag", ev => {
        if(!unlocked) return;

        let i = markers.indexOf(m);
        let ll = ev.target.getLatLng();
        points[i] = [ll.lat,ll.lng];
        draw();
    });

    draw();
});

function draw(){

    if(draft) customMap.removeLayer(draft);
    if(points.length < 2) return;

    draft = L.polygon(points,{
        color: color(document.getElementById("risk").value),
        fillOpacity: 0.4
    }).addTo(customMap);
}

/* =========================
END POLYGON (LOCKED)
========================= */

function endPoly(){

    if(!unlocked) return alert("Locked");

    if(points.length < 3) return alert("Need 3 points");

    let risk = document.getElementById("risk").value;

    let poly = L.polygon(points,{
        color: color(risk),
        fillOpacity: 0.4
    }).addTo(customMap);

    polygons.push({layer: poly, risk});

    poly.on("click", () => {
        if(editMode) select(poly);
    });

    clearDraft();
}

/* =========================
CLEAR
========================= */

function clearDraft(){

    markers.forEach(m => customMap.removeLayer(m));
    markers = [];

    points = [];

    if(draft) customMap.removeLayer(draft);
    draft = null;
}

/* =========================
EDIT MODE (LOCKED)
========================= */

function editModeOn(){

    if(!unlocked){
        alert("Enter password first");
        return;
    }

    editMode = true;
    alert("Click a polygon to edit");
}

function select(poly){

    if(!editMode) return;

    poly.editing.enable();

    poly.on("editable:vertex:dragend", () => {
        console.log("updated polygon");
    });

    alert("Editing enabled");
    editMode = false;
}

/* =========================
SAVE (LOCKED)
========================= */

function save(){

    if(!unlocked) return alert("Locked");

    let date = document.getElementById("saveDate").value;
    if(!date) return alert("Pick date");

    let data = polygons.map(p => ({
        risk: p.risk,
        points: p.layer.getLatLngs()[0]
    }));

    localStorage.setItem("f_"+date, JSON.stringify(data));

    alert("Saved");
}

/* =========================
LOAD (LOCKED)
========================= */

function loadForecast(){

    if(!unlocked) return alert("Locked");

    let d = document.getElementById("loadDate").value;
    let data = localStorage.getItem("f_"+d);

    if(!data) return alert("No data");

    dynamicLayers.forEach(l => dynamicMap.removeLayer(l));
    dynamicLayers = [];

    JSON.parse(data).forEach(f => {

        let poly = L.polygon(f.points,{
            color: color(f.risk),
            fillOpacity: 0.4
        }).addTo(dynamicMap);

        dynamicLayers.push(poly);
    });
}

/* =========================
EXPORT GEOJSON (LOCKED)
========================= */

function exportGeo(){

    if(!unlocked) return alert("Locked");

    let geo = {
        type:"FeatureCollection",
        features: polygons.map(p => ({
            type:"Feature",
            properties:{risk:p.risk},
            geometry:{
                type:"Polygon",
                coordinates:[p.layer.getLatLngs()[0].map(x=>[x.lng,x.lat])]
            }
        }))
    };

    let blob = new Blob([JSON.stringify(geo,null,2)]);
    let a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "tecof.geojson";
    a.click();
}

/* =========================
IMPORT GEOJSON (LOCKED)
========================= */

function importGeo(e){

    if(!unlocked) return alert("Locked");

    let r = new FileReader();

    r.onload = ev => {

        let data = JSON.parse(ev.target.result);

        data.features.forEach(f => {

            let pts = f.geometry.coordinates[0]
                .map(x => [x[1],x[0]]);

            let poly = L.polygon(pts,{
                color: color(f.properties.risk),
                fillOpacity: 0.4
            }).addTo(customMap);

            polygons.push({
                layer: poly,
                risk: f.properties.risk
            });
        });

        alert("Imported");
    };

    r.readAsText(e.target.files[0]);
}

/* =========================
PAGE SWITCH
========================= */

function showPage(id){

    document.querySelectorAll(".page")
        .forEach(p => p.classList.remove("active"));

    document.getElementById(id).classList.add("active");

    setTimeout(() => {
        customMap.invalidateSize();
        dynamicMap.invalidateSize();
    },200);
}

</script>

</body>
</html>
